<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <style>
        .form-label{
            color: purple;
        }
    </style>
</head>
<body>

    <div class="card p-4 m-5 text-center shadow rounded">
        <div class="card-title bg-black text-white p-3 h3">Calculatrice de l'Indece de Masse Corporelle (IMC)</div>
        <form action="" class="bg-light" id="myform">
            <label for="genre" class="form-label mb-2 d-block">Vous êtes</label> 
            <input type="radio" name="genre" id="femme" class="form-check-input" value="10" checked> <label for="femme" class="form-check-label me-5">Une femme</label>
            <input type="radio" name="genre" id="homme" class="form-check-input" value="0"> <label for="homme" class="form-check-label ">Un homme</label>
            <div class="mt-4 d-flex justify-content-around">
                <div class="">
                <label for="" class="form-label  ">Votre âge</label>
                <input type="number" step="1" min="4" max="100" class="bg-white  form-control shadow">
                </div>
                <div>
                <label for="" class="form-label">Votre taille (cm)</label>
                <input type="number" step="0.1" min="100" max="200" class="bg-white form-control shadow" id="taille">
                </div>
                <div>
                <label for="" class="form-label">Votre poids (KG)</label>
                <input type="number" min="10" max="200" step=".1" class="bg-white form-control shadow" id="poids">
                </div>
            </div>
            <button type="submit" class="btn btn-md btn-danger mt-4 mb-3">Calculer</button>
            <div class="alert alert-info d-none" id="result">
                
            </div>
        </form>
    </div>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
